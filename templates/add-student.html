
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add New Student</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            font-family: 'Segoe UI', sans-serif;
            background: #111827;
        }

        form {
            width: 650px;
            max-width: 100%;
            padding: 35px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 20px;
        }

        .heading {
            grid-column: 1 / -1;
            margin-bottom: 15px;
            padding-bottom: 18px;
            border-bottom: 2px solid #374151;
        }

        .heading h2 {
            color: #f9fafb;
            font-size: 27px;
            margin-bottom: 7px;
        }

        .heading p {
            color: #9ca3af;
            font-size: 14px;
        }

        label {
            display: block;
            color: #d1d5db;
            font-size: 14px;
            font-weight: 600;
            margin: 12px 0 8px;
        }

        input, select {
            width: 100%;
            padding: 13px;
            background: #111827;
            color: #f9fafb;
            border: 1px solid #4b5563;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input:focus, select:focus {
            border-color: #f97316;
            box-shadow: 0 0 0 3px rgba(249,115,22,0.15);
        }

        input:hover, select:hover {
            border-color: #f97316;
        }

        input::placeholder {
            color: #6b7280;
        }

        select option {
            background: #1f2937;
            color: white;
        }

        button {
            grid-column: 1 / -1;
            width: 100%;
            margin-top: 22px;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(120deg, #f97316, #ea580c);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(249,115,22,0.3);
        }

        .back {
            grid-column: 1 / -1;
            text-align: center;
            margin-top: 10px;
        }

        .back a {
            color: #9ca3af;
            font-size: 14px;
            text-decoration: none;
            transition: 0.3s;
        }

        .back a:hover {
            color: #f97316;
        }

        @media(max-width: 550px) {

            form {
                grid-template-columns: 1fr;
                padding: 22px;
            }

            .heading,
            button,
            .back {
                grid-column: 1;
            }

            .heading h2 {
                font-size: 23px;
            }

        }

    </style>

</head>

<body>

    <form action="/students/add" method="post">

        <div class="heading">

            <h2>Add New Student</h2>

            <p>Enter student details to register a new student.</p>

        </div>


        <div>
            <label for="name">Student Name</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter student name"
                required
            >
        </div>


        <div>
            <label for="age">Age</label>

            <input
                type="number"
                id="age"
                name="age"
                placeholder="Enter age"
                min="1"
                required
            >
        </div>


        <div>
            <label for="gender">Gender</label>

            <select name="gender" id="gender" required>
                <option value="">Select gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
        </div>


        <div>
            <label for="marks">Marks</label>

            <input
                type="number"
                id="marks"
                name="marks"
                placeholder="Enter marks"
                min="0"
                required
            >
        </div>


        <div>
            <label for="courese">Course</label>

            <input
                type="text"
                id="courese"
                name="courese"
                placeholder="Enter course name"
                required
            >
        </div>


        <div>
            <label for="image">Profile Image URL</label>

            <input
                type="url"
                id="image"
                name="image"
                placeholder="Paste image URL"
                required
            >
        </div>


        <div>
            <label for="status">Attendance Status</label>

            <select name="status" id="status" required>

                <option value="">Select status</option>

                <option value="true">Present</option>

                <option value="false">Absent</option>

            </select>
        </div>


        <button type="submit">
            + Add Student
        </button>


        <div class="back">

            <a href="/">← Back to Dashboard</a>

        </div>

    </form>

</body>

</html>
